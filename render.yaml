services:
  - type: web
    name: executor-server
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GLOBAL_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://toolpix.pythonanywhere.com,https://uthakkan.in,*"
      - key: EXECUTOR_MAX_CODE_BYTES
        value: "65536"
      - key: EXECUTOR_MAX_OUTPUT_BYTES
        value: "200000"
      - key: EXECUTOR_TIMEOUT_S
        value: "45"
