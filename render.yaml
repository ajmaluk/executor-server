services:
  - type: web
    name: executor-server
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: API_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://toolpix.pythonanywhere.com,https://uthakkan.in,*"
      - key: PISTON_API_URL
        value: "https://emkc.org/api/v2/piston/execute"
      - key: EXECUTOR_MAX_CODE_BYTES
        value: "65536"
      - key: EXECUTOR_MAX_OUTPUT_BYTES
        value: "200000"
      - key: RATE_LIMIT_ENABLED
        value: "false"
